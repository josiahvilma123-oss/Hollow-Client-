plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	accessWidenerPath = file('src/main/resources/hollow.accesswidener')
}

fabricApi {
	// Client game tests launch the real game (headless under Xvfb in CI) and capture screenshots.
	configureTests {
		createSourceSet = true
		modId = 'hollow-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mods for the production test run (the built jar is added automatically).
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
			'minecraft_version': project.minecraft_version,
			'loader_version': project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property 'archivesName', project.base.archivesName
	from('LICENSE') {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

test {
	useJUnitPlatform()
}

// Runs the remapped release jar exactly as players get it (intermediary names, no dev tooling).
tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	useXVFB = false
}
